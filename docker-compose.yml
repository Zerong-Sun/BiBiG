version: '3.8'

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: bibig
      POSTGRES_USER: bibig
      POSTGRES_PASSWORD: bibig123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - minio
    environment:
      DATABASE_URL: postgresql://bibig:bibig123@postgres:5432/bibig
      MINIO_ENDPOINT: minio:9000
      USE_LOCAL_STORAGE: "false"
      USE_MOCK_TRANSCRIPTION: "true"
      DEFAULT_LLM_PROVIDER: mock
    volumes:
      - ./backend/storage:/app/storage

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  minio_data:
